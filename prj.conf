CONFIG_GPIO=y
# Enable UART Driver
CONFIG_SERIAL=y
#CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_PWM=y
CONFIG_PWM_SAM0_TCC=y
#CONFIG_PWM_SAM0=y



# Direct printk and shell to the console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_RING_BUFFER=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MPU6050=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
#CONFIG_SH1106=y
#CONFIG_CFB_FONT_0508=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y


CONFIG_ADC=y

# If using LVGL for the UI:
#CONFIG_LVGL=y

CONFIG_LED=y
#CONFIG_LED_PWM=y


CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_SHELL=n

CONFIG_HEAP_MEM_POOL_SIZE=2048

# add floating point printf support
#CONFIG_PICOLIBC=y
#CONFIG_PICOLIBC_IO_FLOAT=y

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
